# Full speed on AC. On battery the low-power platform profile roughly halves
# sustained all-core clocks (measured 2505 -> 1257 MHz, 26.9 -> 15.5 W), so
# heavy jobs belong on AC.
CPU_ENERGY_PERF_POLICY_ON_AC=performance
CPU_ENERGY_PERF_POLICY_ON_BAT=power
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=1
PLATFORM_PROFILE_ON_AC=performance
PLATFORM_PROFILE_ON_BAT=low-power
