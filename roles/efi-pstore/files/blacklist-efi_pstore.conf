# efi_pstore saves kernel crash logs to UEFI variables. On this ThinkPad
# (21M3, BIOS R2KET39W 1.28) the firmware page-faulted and the kernel disabled
# EFI runtime services; a later oops then spun forever in pstore_dump and
# soft-locked the other CPUs (2026-10-12). The journal still keeps the oops.
#
# blacklist only stops alias autoloading. systemd-pstore.service loads the
# module by name through modprobe@efi_pstore.service, so install is needed too.
blacklist efi_pstore
install efi_pstore /bin/true
