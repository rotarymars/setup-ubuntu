---
- name: Check for GNOME Shell
  ansible.builtin.command: gnome-shell --version
  register: workspace_grid_shell
  changed_when: false
  failed_when: false

- name: Set up the workspace grid
  when: workspace_grid_shell.rc == 0
  block:
    - name: Record the GNOME Shell major version
      ansible.builtin.set_fact:
        workspace_grid_shell_major: "{{ workspace_grid_shell.stdout | regex_search('[0-9]+') }}"

    - name: Look up the Workspace Matrix release for this GNOME Shell
      ansible.builtin.uri:
        url: "{{ workspace_grid_ego_url }}/extension-info/?uuid={{ workspace_grid_uuid }}&shell_version={{ workspace_grid_shell_major }}"
      register: workspace_grid_ego

    - name: Fail when no release supports this GNOME Shell
      ansible.builtin.fail:
        msg: "Workspace Matrix has no release for GNOME Shell {{ workspace_grid_shell_major }}."
      when: workspace_grid_shell_major not in workspace_grid_ego.json.shell_version_map

    - name: Record the release to install
      ansible.builtin.set_fact:
        workspace_grid_release: "{{ workspace_grid_ego.json.shell_version_map[workspace_grid_shell_major] }}"

    - name: Stat the installed extension metadata
      ansible.builtin.stat:
        path: "{{ workspace_grid_extension_dir }}/metadata.json"
      register: workspace_grid_metadata_stat

    - name: Read the installed extension metadata
      ansible.builtin.slurp:
        src: "{{ workspace_grid_extension_dir }}/metadata.json"
      register: workspace_grid_metadata
      when: workspace_grid_metadata_stat.stat.exists

    - name: Record the installed extension version
      ansible.builtin.set_fact:
        workspace_grid_installed_version: >-
          {{ (workspace_grid_metadata.content | b64decode | from_json).version
             if workspace_grid_metadata_stat.stat.exists else 0 }}

    - name: Install the extension when it is missing or outdated
      when: workspace_grid_installed_version | int != workspace_grid_release.version | int
      block:
        - name: Create a temporary path for the extension bundle
          ansible.builtin.tempfile:
            state: file
            suffix: .shell-extension.zip
          register: workspace_grid_bundle

        - name: Download the extension bundle
          ansible.builtin.get_url:
            url: "{{ workspace_grid_ego_url }}/download-extension/{{ workspace_grid_uuid }}.shell-extension.zip?version_tag={{ workspace_grid_release.pk }}"
            dest: "{{ workspace_grid_bundle.path }}"
            force: true
            mode: "0644"

        - name: Unpack the extension bundle
          ansible.builtin.command: "gnome-extensions install --force {{ workspace_grid_bundle.path }}"
          changed_when: true
      always:
        - name: Remove the extension bundle
          ansible.builtin.file:
            path: "{{ workspace_grid_bundle.path }}"
            state: absent
          when: workspace_grid_bundle.path is defined

    - name: Read the enabled GNOME Shell extensions
      ansible.builtin.command: gsettings get org.gnome.shell enabled-extensions
      register: workspace_grid_enabled
      changed_when: false

    - name: Enable Workspace Matrix
      ansible.builtin.command: "gnome-extensions enable {{ workspace_grid_uuid }}"
      when: workspace_grid_uuid not in workspace_grid_enabled.stdout
      changed_when: true

    - name: Use a fixed number of workspaces
      community.general.dconf:
        key: /org/gnome/mutter/dynamic-workspaces
        value: "false"

    - name: Size the workspace pool to the grid
      community.general.dconf:
        key: /org/gnome/desktop/wm/preferences/num-workspaces
        value: "{{ (workspace_grid_rows | int) * (workspace_grid_columns | int) }}"

    - name: Configure Workspace Matrix
      community.general.dconf:
        key: "/org/gnome/shell/extensions/wsmatrix/{{ item.key }}"
        value: "{{ item.value }}"
      loop:
        - key: num-rows
          value: "{{ workspace_grid_rows | int }}"
        - key: num-columns
          value: "{{ workspace_grid_columns | int }}"
        - key: show-thumbnails
          value: "{{ workspace_grid_show_thumbnails | bool | to_json }}"
        - key: show-overview-grid
          value: "{{ workspace_grid_show_overview_grid | bool | to_json }}"
        - key: popup-timeout
          value: "{{ workspace_grid_popup_timeout | int }}"
        - key: wraparound-mode
          value: "{{ workspace_grid_wraparound_mode | to_json }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Bind Ctrl+Alt+arrow to grid navigation
      community.general.dconf:
        key: "/org/gnome/desktop/wm/keybindings/{{ item.key }}"
        value: "{{ item.value | to_json }}"
      loop: "{{ workspace_grid_keybindings | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when: workspace_grid_set_keybindings | bool

    - name: Check whether GNOME Shell has the extension loaded
      ansible.builtin.command: "gnome-extensions info {{ workspace_grid_uuid }}"
      register: workspace_grid_state
      changed_when: false
      failed_when: false

    - name: Remind about the session restart
      ansible.builtin.debug:
        msg: >-
          Workspace Matrix is installed and enabled for a
          {{ workspace_grid_rows }}x{{ workspace_grid_columns }} grid.
          Log out and back in to load it; Wayland cannot restart GNOME Shell in place.
      when: "'State: ACTIVE' not in workspace_grid_state.stdout"
