---
# Only the parts that are the same on every machine live here. The kernel side
# (shim validation, resume= on the command line) is per machine and interactive,
# see "Enable hibernate" in README.md.
- name: Allow hibernate through polkit
  become: true
  ansible.builtin.copy:
    src: 10-enable-hibernate.rules
    dest: /etc/polkit-1/rules.d/10-enable-hibernate.rules
    owner: root
    group: root
    mode: "0644"
  tags: [hibernate-polkit]

# A drop-in, because it overrides the HandleLidSwitch* lines in logind.conf.
- name: Set the lid close action
  become: true
  block:
    - name: Create the logind drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/logind.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Write the lid close drop-in
      ansible.builtin.copy:
        dest: /etc/systemd/logind.conf.d/10-lid-hibernate.conf
        content: |
          [Login]
          HandleLidSwitch={{ hibernate_lid_action }}
          HandleLidSwitchExternalPower={{ hibernate_lid_action }}
        owner: root
        group: root
        mode: "0644"
      notify: Reload logind

    - name: Create the sleep drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/sleep.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    # Read by systemd-sleep on every sleep, so no reload is needed.
    - name: Write the hibernate delay drop-in
      ansible.builtin.copy:
        dest: /etc/systemd/sleep.conf.d/10-hibernate-delay.conf
        content: |
          [Sleep]
          HibernateDelaySec={{ hibernate_delay }}
        owner: root
        group: root
        mode: "0644"
  tags: [hibernate-lid]

- name: Check for GNOME Shell
  ansible.builtin.command: gnome-shell --version
  register: hibernate_button_shell
  changed_when: false
  failed_when: false

- name: Set up the Hibernate Status Button
  when: hibernate_button_shell.rc == 0
  block:
    - name: Record the GNOME Shell major version
      ansible.builtin.set_fact:
        hibernate_button_shell_major: "{{ hibernate_button_shell.stdout | regex_search('[0-9]+') }}"

    - name: Look up the Hibernate Status Button release for this GNOME Shell
      ansible.builtin.uri:
        url: "{{ hibernate_button_ego_url }}/extension-info/?uuid={{ hibernate_button_uuid }}&shell_version={{ hibernate_button_shell_major }}"
      register: hibernate_button_ego

    - name: Fail when no release supports this GNOME Shell
      ansible.builtin.fail:
        msg: "Hibernate Status Button has no release for GNOME Shell {{ hibernate_button_shell_major }}."
      when: hibernate_button_shell_major not in hibernate_button_ego.json.shell_version_map

    - name: Record the release to install
      ansible.builtin.set_fact:
        hibernate_button_release: "{{ hibernate_button_ego.json.shell_version_map[hibernate_button_shell_major] }}"

    - name: Stat the installed extension metadata
      ansible.builtin.stat:
        path: "{{ hibernate_button_extension_dir }}/metadata.json"
      register: hibernate_button_metadata_stat

    - name: Read the installed extension metadata
      ansible.builtin.slurp:
        src: "{{ hibernate_button_extension_dir }}/metadata.json"
      register: hibernate_button_metadata
      when: hibernate_button_metadata_stat.stat.exists

    - name: Record the installed extension version
      ansible.builtin.set_fact:
        hibernate_button_installed_version: >-
          {{ (hibernate_button_metadata.content | b64decode | from_json).version
             if hibernate_button_metadata_stat.stat.exists else 0 }}

    - name: Install the extension when it is missing or outdated
      when: hibernate_button_installed_version | int != hibernate_button_release.version | int
      block:
        - name: Create a temporary path for the extension bundle
          ansible.builtin.tempfile:
            state: file
            suffix: .shell-extension.zip
          register: hibernate_button_bundle

        - name: Download the extension bundle
          ansible.builtin.get_url:
            url: "{{ hibernate_button_ego_url }}/download-extension/{{ hibernate_button_uuid }}.shell-extension.zip?version_tag={{ hibernate_button_release.pk }}"
            dest: "{{ hibernate_button_bundle.path }}"
            force: true
            mode: "0644"

        - name: Unpack the extension bundle
          ansible.builtin.command: "gnome-extensions install --force {{ hibernate_button_bundle.path }}"
          changed_when: true
      always:
        - name: Remove the extension bundle
          ansible.builtin.file:
            path: "{{ hibernate_button_bundle.path }}"
            state: absent
          when: hibernate_button_bundle.path is defined

    - name: Read the enabled GNOME Shell extensions
      ansible.builtin.command: gsettings get org.gnome.shell enabled-extensions
      register: hibernate_button_enabled
      changed_when: false

    - name: Record the enabled GNOME Shell extensions
      ansible.builtin.set_fact:
        hibernate_button_enabled_list: "{{ hibernate_button_enabled.stdout | trim | regex_replace('^@as ', '') | from_yaml }}"

    # Same reason as in gnome-workspace-grid: the running shell rejects
    # "gnome-extensions enable" for an extension installed after login, so
    # write the key it reads at startup.
    - name: Enable Hibernate Status Button
      community.general.dconf:
        key: /org/gnome/shell/enabled-extensions
        value: "{{ (hibernate_button_enabled_list + [hibernate_button_uuid]) | to_json }}"
      when: hibernate_button_uuid not in hibernate_button_enabled_list

    - name: Read the disabled GNOME Shell extensions
      ansible.builtin.command: gsettings get org.gnome.shell disabled-extensions
      register: hibernate_button_disabled
      changed_when: false

    - name: Record the disabled GNOME Shell extensions
      ansible.builtin.set_fact:
        hibernate_button_disabled_list: "{{ hibernate_button_disabled.stdout | trim | regex_replace('^@as ', '') | from_yaml }}"

    - name: Drop Hibernate Status Button from the disabled list
      community.general.dconf:
        key: /org/gnome/shell/disabled-extensions
        value: "{{ (hibernate_button_disabled_list | difference([hibernate_button_uuid])) | to_json }}"
      when: hibernate_button_uuid in hibernate_button_disabled_list

    - name: Check whether GNOME Shell has the extension loaded
      ansible.builtin.command: "gnome-extensions info {{ hibernate_button_uuid }}"
      register: hibernate_button_state
      changed_when: false
      failed_when: false

    - name: Remind about the session restart
      ansible.builtin.debug:
        msg: >-
          Hibernate Status Button is installed and enabled.
          Log out and back in to load it; Wayland cannot restart GNOME Shell in place.
      when: "'State: ACTIVE' not in hibernate_button_state.stdout"
