---
# Hibernate Status Button adds Hibernate (and Hybrid Sleep, with Alt held) to
# the GNOME power menu, which Ubuntu hides.
# https://extensions.gnome.org/extension/755/hibernate-status-button/
hibernate_button_uuid: hibernate-status@dromi
hibernate_button_ego_url: https://extensions.gnome.org
hibernate_button_extension_dir: "~/.local/share/gnome-shell/extensions/{{ hibernate_button_uuid }}"

# What closing the lid does on battery. suspend-then-hibernate suspends, then
# hibernates when the battery runs low (or after hibernate_delay, if set), so a
# forgotten laptop never dies in suspend.
# suspend | hibernate | hybrid-sleep | suspend-then-hibernate | ignore
hibernate_lid_action: suspend-then-hibernate
# Same, on AC power. Hibernating while plugged in only costs a slow resume.
# Decided when the lid closes: unplugging afterwards does not switch it.
hibernate_lid_action_ac: suspend
# Time in suspend before hibernating. Empty lets systemd decide from the
# battery: it hibernates on the firmware low-battery alarm, or at about 5%.
hibernate_delay: ""
